server {
    listen 80;
    listen [::]:80;
    server_name eytzyg.cn www.eytzyg.cn demo.eytzyg.cn;
    return 301 https://www.eytzyg.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eytzyg.cn;

    ssl_certificate /www/server/panel/vhost/cert/eytzyg.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/eytzyg.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    return 301 https://www.eytzyg.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.eytzyg.cn;

    root /www/wwwroot/demo.eytzyg.cn;
    index index.php index.html;
    charset utf-8;
    client_max_body_size 64m;

    ssl_certificate /www/server/panel/vhost/cert/eytzyg.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/eytzyg.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /www/wwwlogs/www.eytzyg.cn.log;
    error_log /www/wwwlogs/www.eytzyg.cn.error.log;

    location = /xmlrpc.php { deny all; }
    location / { try_files $uri $uri/ /index.php?$args; }

    location ~ \.php$ {
        try_files $uri =404;
        include /www/server/nginx/conf/fastcgi.conf;
        fastcgi_pass unix:/tmp/php-cgi-83.sock;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
    }

    location ~* \.(?:css|js|jpg|jpeg|gif|png|webp|avif|svg|ico|woff|woff2|ttf|otf)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known/) { deny all; }
}
