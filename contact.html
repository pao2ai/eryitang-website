<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="尔意堂中医馆地址、预约电话、营业时间及高德地图到馆导航。">
  <title>联系我们｜尔意堂中医馆</title>
  <link rel="stylesheet" href="site.css">
  <link rel="stylesheet" href="typography.css">
  <link rel="stylesheet" href="shared.css">

<body class="page-contact-v1 has-shared-shell" data-nav-active="contact">
  <div id="siteHeaderSlot" class="site-shell-slot"></div>



  <main>
    <header class="contact-hero contact-hero-image-only" aria-labelledby="contactBannerTitle">
      <h1 class="sr-only" id="contactBannerTitle">联系我们｜尔意堂中医馆</h1>
    </header>

    <section class="section contact-main-section">
      <div class="container contact-main-grid">
        <article class="contact-panel reveal">
          <div class="contact-panel-heading">
            <span>到馆信息</span>
            <h2>尔意堂中医馆</h2>
            <p>目的地位于名望大厦5楼501。地图路线到达南1门后，请继续按楼内指引前往医馆。</p>
          </div>
          <dl class="contact-facts">
            <div><dt>医馆地址</dt><dd>成都市锦江区梨花街8号<br>名望大厦501</dd></div>
            <div><dt>预约咨询</dt><dd><a href="tel:19982097343">199 8209 7343</a></dd></div>
            <div><dt>营业时间</dt><dd>每日 09:00—19:00</dd></div>
          </dl>
          <div class="contact-actions">
            <a class="contact-primary-action" href="https://surl.amap.com/8kfLojo1ecZq" target="_blank" rel="noopener noreferrer">地图导航</a>
            <a class="contact-copy-action" href="tel:19982097343">电话预约</a>
          </div>
        </article>

        <figure class="contact-map-card reveal delay-1">
          <img class="contact-map-image" src="assets/images/contact-v1/amap-route.png" alt="从天府广场地铁站D口步行至南1门的高德地图路线截图">
        </figure>
      </div>
    </section>

    <section class="contact-gallery-section" aria-labelledby="contactGalleryTitle">
      <div class="container contact-gallery-heading"><span>CLINIC SPACE</span><h2 id="contactGalleryTitle">闹市藏静境，医道安尘劳</h2></div>
      <div class="contact-gallery-marquee reveal">
        <div class="contact-gallery-track">
          <figure><img src="assets/images/home-v4/hero-entry.jpg" alt="尔意堂中医馆庭院入口与休息空间"></figure>
          <figure><img src="assets/images/home-v4/hero-courtyard.png" alt="尔意堂中医馆清静庭院"></figure>
          <figure><img src="assets/images/brand-v2/002.jpg" alt="尔意堂中医馆诊疗空间陈设"></figure>
          <figure><img src="assets/images/brand-v1/story-courtyard.png" alt="尔意堂中医馆庭院空间"></figure>
          <figure><img src="assets/images/brand-v1/story-detail-garden.jpg" alt="尔意堂中医馆绿植与空间细节"></figure>
          <figure><img src="assets/images/article-list-v1/ad-consult.jpg" alt="尔意堂中医馆室内环境"></figure>
          <figure aria-hidden="true"><img src="assets/images/home-v4/hero-entry.jpg" alt=""></figure>
          <figure aria-hidden="true"><img src="assets/images/home-v4/hero-courtyard.png" alt=""></figure>
          <figure aria-hidden="true"><img src="assets/images/brand-v2/002.jpg" alt=""></figure>
          <figure aria-hidden="true"><img src="assets/images/brand-v1/story-courtyard.png" alt=""></figure>
          <figure aria-hidden="true"><img src="assets/images/brand-v1/story-detail-garden.jpg" alt=""></figure>
          <figure aria-hidden="true"><img src="assets/images/article-list-v1/ad-consult.jpg" alt=""></figure>
        </div>
      </div>
    </section>
  </main>

  <div id="siteFooterSlot" class="site-shell-slot"></div>
  <script src="shared-components.js"></script>
  <script src="site.js"></script>
